name: Bug report
description: Something in the game behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Solo vs the bot, Online with a friend]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome 130
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For a rules bug, the hand and the tricks played (or the room code) help most.
