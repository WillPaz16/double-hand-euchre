name: CI

# There was no .github/ directory at all before this workflow, on a project that has shipped
# regressions its own tooling could have caught (see scripts/scale-audit.js's collision check,
# added after a prop-placement bug shipped verified once, by hand, at one viewport, in 2g.4).
# This runs the checks that already exist in the repo — nothing here is new logic, only new
# automation around it.
on:
  push:
    # `main` is production, `dev` is the staging Worker — both deploy (see the `deploy` job).
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm run build` runs `wrangler types` (the Worker's type check), and
          # wrangler 4 requires Node >= 22. On 20 the build step fails outright.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Engine fuzz (10k random legal deals)
        run: npm run fuzz

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r art/requirements.txt

      - name: Art determinism (pixel-identical across two runs)
        run: python art/check_determinism.py

      - name: Card art frozen
        # ASSETS.md rule 6: the 24 faces and card backs are frozen and every environment/art
        # change is supposed to leave them untouched. A raw `git diff` on the PNGs would
        # false-positive here: CI's Pillow version is not guaranteed to match whatever
        # generated the committed bytes, and ASSETS.md documents that identical PILLOW PIXELS
        # can still encode to different PNG bytes across versions. Pixel-compares against the
        # git-committed baseline instead — see art/check_cards_frozen.py.
        run: python art/check_cards_frozen.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Scale + collision audit (all four target viewports)
        run: npm run audit

      - name: Production build
        run: npm run build

  # Deploys only after EVERY check above has passed, and only for a push — a pull request runs
  # the checks and stops, so nothing reaches Cloudflare until it is merged.
  #   main -> production Worker  `euchre`      https://euchre.willpaz16.workers.dev
  #   dev  -> staging Worker     `euchre-dev`  https://euchre-dev.willpaz16.workers.dev
  # The two have separate Durable Object namespaces, so dev rooms can never touch a live game.
  deploy:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy per branch at a time, and a newer push supersedes a queued older one. Two
    # overlapping deploys can finish out of order and leave the OLDER build live.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A missing secret otherwise surfaces as a wrangler authentication error several steps
      # later, which reads like Cloudflare is broken rather than like setup is unfinished.
      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. See DEPLOY.md, 'Automatic deploys'."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env=dev
          fi
