# One app, one machine, serving both the game and its WebSocket.
#
# THE CONSTRAINT THAT SHAPES THIS FILE: rooms live in the server process's own memory (see
# server/index.ts's header). Two instances are two disjoint sets of room codes — two players
# entering the same code would land on different machines and never see each other, and nothing
# in the protocol can detect or report that. So this app runs at a count of exactly ONE, and
# every setting below that looks like a scaling choice is really that constraint restated.
#
# Deploy the first time with `fly deploy --ha=false`: without it Fly provisions a second,
# standby machine by default, which is the failure above.

app = 'euchre'
primary_region = 'ord'

[build]

[env]
  PORT = '8787'
  # On the mounted volume, not the container filesystem, so in-progress games survive a
  # restart. `saveRooms` writes `<file>.tmp` and renames — same directory, therefore the same
  # filesystem, which is what makes that rename atomic rather than a cross-device copy.
  ROOMS_FILE = '/data/rooms.json'

[http_service]
  internal_port = 8787
  force_https = true
  # WebSockets need no special configuration here — Fly's proxy passes the upgrade through.
  # What DOES need care is the pair below.
  #
  # `auto_stop_machines = 'off'` and a minimum of one: a machine that stops when idle drops
  # every live game with it, and the traffic pattern of a card game is long-lived sockets with
  # long quiet stretches — exactly what idle-detection misreads as "nobody is here". The volume
  # would restore the rooms on the next boot, but the players' sockets would already be gone.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[mounts]
  source = 'euchre_data'
  destination = '/data'

[[vm]]
  # The smallest machine Fly offers, which is still generous for this: the whole dataset is a
  # handful of card games. Raise it when a measurement says to, not before.
  size = 'shared-cpu-1x'
  memory = '256mb'
